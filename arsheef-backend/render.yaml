services:
  - type: web
    name: arsheef-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: arsheef-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

databases:
  - name: arsheef-db
    plan: free
